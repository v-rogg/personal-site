[package]
name = "vr-www-signatures-rs"
version = "0.1.1"
edition = "2024"
authors = ["v-rogg <mail@valentinrogg.de>"]
description = "A Rust worker for managing signatures for VR WWW"
repository = "https://github.com/v-rogg/vr-www-signatures-rs"

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[dependencies]
uuid = { version = "1.11.0", features = ["v4", "js"] }
worker = { version = "0.7", features = ["d1"] }
worker-macros = { version = "0.7" }
console_error_panic_hook = { version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.99"
serde-wasm-bindgen = "0.6.5"
chrono = { version = "0.4.38", features = [] }
petname = "2.0.2"
flate2 = "1.0"
base64 = "0.21"
getrandom = { version = "0.2", features = ["js"] }
