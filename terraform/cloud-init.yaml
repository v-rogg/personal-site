#cloud-config

package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - ufw
  - fail2ban
  - sqlite3
  - gnupg
  - unattended-upgrades

users:
  - name: ${app_user}
    groups: docker, sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  # Docker daemon config
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "storage-driver": "overlay2"
      }

  # SSH hardening
  - path: /etc/ssh/sshd_config.d/hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3
      LoginGraceTime 20
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # Fail2ban config
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      port = ssh
      maxretry = 3
      bantime = 24h

  # Environment template
  - path: ${app_directory}/.env.template
    owner: ${app_user}:${app_user}
    content: |
      # Database
      DATABASE_URL=/data/app.db

      # SMTP (configure for your provider)
      SMTP_HOST=smtp.resend.com
      SMTP_PORT=465
      SMTP_USER=resend
      SMTP_PASS=

      # Friendly Captcha
      FRIENDLY_CAPTCHA_SECRET=
      FRIENDLY_CAPTCHA_SITEKEY=

      # Email
      EMAIL_FROM=noreply@${domain}
      EMAIL_TO=mail@${domain}

      # App
      BASE_URL=https://${domain}
      RUST_LOG=info,vr_www_api=debug

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ${app_user}

  # Create app directories
  - mkdir -p ${app_directory}/{data,backups,crowdsec}
  - chown -R ${app_user}:${app_user} ${app_directory}

  # Configure UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow http
  - ufw allow https
  - ufw --force enable

  # Start fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Restart SSH
  - systemctl restart sshd

  # Set timezone
  - timedatectl set-timezone Europe/Berlin

final_message: "Cloud-init complete for ${domain}"
