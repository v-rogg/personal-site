        // ISO WKB: base_type + 1000 for Z, + 2000 for M, + 3000 for ZM
        const ewkbHasZ = (typeWord & 0x80000000) !== 0;
        const ewkbHasM = (typeWord & 0x40000000) !== 0;
        const ewkbHasSrid = (typeWord & 0x20000000) !== 0;
        let baseType = typeWord & 0x0fffffff;

        // Skip SRID if present (EWKB extension)
        if (ewkbHasSrid) {
          offset += 4;
        }

        // Detect ISO WKB Z/M dimensions
        const isoHasZ = baseType >= 1000 && baseType < 2000;
        const isoHasM = baseType >= 2000 && baseType < 3000;
        const isoHasZM = baseType >= 3000;

        // Normalize to 2D base type
        if (isoHasZM) baseType -= 3000;
        else if (isoHasM) baseType -= 2000;
        else if (isoHasZ) baseType -= 1000;

        // Combined Z detection (either EWKB flag or ISO format)
        let hasZ = ewkbHasZ || isoHasZ || isoHasZM;
        let hasM = ewkbHasM || isoHasM || isoHasZM;
        let geomType = baseType;

        function readDouble() {
          const val = view.getFloat64(offset, littleEndian);
          offset += 8;
          return val;
        }

        function readUint32() {
          const val = view.getUint32(offset, littleEndian);
          offset += 4;
          return val;
        }

        function readPoint(localHasZ, localHasM) {
          const coords = [readDouble(), readDouble()];
          if (localHasZ) coords.push(readDouble());
          if (localHasM) readDouble(); // Skip M value (not used in GeoJSON)
          return coords;
        }

          const numPoints = readUint32();
          const coords = [];
          for (let i = 0; i < numPoints; i++) {
            coords.push(readPoint(localHasZ, localHasM));
          }
          return coords;
        }

        function readPolygon(localHasZ, localHasM) {
          const numRings = readUint32();
          const rings = [];
          for (let i = 0; i < numRings; i++) {
            rings.push(readLineString(localHasZ, localHasM));
          }
          return rings;
        }

        function readNestedGeometry() {
          const nestedByteOrder = wkb[offset++];
          const nestedLittleEndian = nestedByteOrder === 1;
          let nestedTypeWord = view.getUint32(offset, nestedLittleEndian);
          offset += 4;

          // Parse nested type word - supports both EWKB flags and ISO WKB
          const nestedEwkbHasZ = (nestedTypeWord & 0x80000000) !== 0;
          const nestedEwkbHasM = (nestedTypeWord & 0x40000000) !== 0;
          const nestedEwkbHasSrid = (nestedTypeWord & 0x20000000) !== 0;
          let nestedBaseType = nestedTypeWord & 0x0fffffff;

          if (nestedEwkbHasSrid) offset += 4; // Skip SRID

          // Detect ISO WKB dimensions
          const nestedIsoHasZ = nestedBaseType >= 1000 && nestedBaseType < 2000;
          const nestedIsoHasM = nestedBaseType >= 2000 && nestedBaseType < 3000;
          const nestedIsoHasZM = nestedBaseType >= 3000;

          if (nestedIsoHasZM) nestedBaseType -= 3000;
          else if (nestedIsoHasM) nestedBaseType -= 2000;
          else if (nestedIsoHasZ) nestedBaseType -= 1000;

          const nestedHasZ = nestedEwkbHasZ || nestedIsoHasZ || nestedIsoHasZM;
          const nestedHasM = nestedEwkbHasM || nestedIsoHasM || nestedIsoHasZM;

          return parseGeometry(nestedBaseType, nestedHasZ, nestedHasM);
        }

        function parseGeometry(type, localHasZ, localHasM) {
          switch (type) {
            case 1: // Point / PointZ
              return { type: "Point", coordinates: readPoint(localHasZ, localHasM) };
            case 2: // LineString / LineStringZ
              return { type: "LineString", coordinates: readLineString(localHasZ, localHasM) };
            case 3: // Polygon / PolygonZ
              return { type: "Polygon", coordinates: readPolygon(localHasZ, localHasM) };
            case 4: {
              // MultiPoint / MultiPointZ
              const numPoints = readUint32();
              const coords = [];
              for (let i = 0; i < numPoints; i++) {
                const geom = readNestedGeometry();
                if (geom && geom.coordinates) coords.push(geom.coordinates);
              }
              return { type: "MultiPoint", coordinates: coords };
            }
            case 5: {
              // MultiLineString / MultiLineStringZ
              const numLines = readUint32();
              const coords = [];
              for (let i = 0; i < numLines; i++) {
                const geom = readNestedGeometry();
                if (geom && geom.coordinates) coords.push(geom.coordinates);
              }
              return { type: "MultiLineString", coordinates: coords };
            }
            case 6: {
              // MultiPolygon / MultiPolygonZ
              const numPolygons = readUint32();
              const coords = [];
              for (let i = 0; i < numPolygons; i++) {
                const geom = readNestedGeometry();
                if (geom && geom.coordinates) coords.push(geom.coordinates);

              return { type: "MultiPolygon", coordinates: coords };
            }
            case 7: {
              // GeometryCollection / GeometryCollectionZ
              const numGeometries = readUint32();
              const geometries = [];
              for (let i = 0; i < numGeometries; i++) {
                geometries.push(readNestedGeometry());
              }
              return { type: "GeometryCollection", geometries: geometries };
            }
            default:
              return null;
          }

        geojson.features.forEach((f) => {

          }
        });

        return { minLng, maxLng, minLat, maxLat, minZ: minZ === Infinity ? 0 : minZ, maxZ: maxZ === -Infinity ? 0 : maxZ };

      // Triangulate a 3D polygon using earcut

        if (coords3d.length < 3) return null;

        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len < 1e-10) return null;
        nx /= len;
        ny /= len;
        nz /= len;

        // Choose projection plane based on dominant normal component
        let project2d;
        const absNx = Math.abs(nx),
          absNy = Math.abs(ny),
          absNz = Math.abs(nz);

        if (absNz >= absNx && absNz >= absNy) {
          // Project onto XY plane (horizontal surfaces)
          project2d = (p) => [p[0], p[1]];
        } else if (absNy >= absNx) {
          // Project onto XZ plane (vertical wall facing Y)
          project2d = (p) => [p[0], p[2]];
        } else {
          // Project onto YZ plane (vertical wall facing X)
          project2d = (p) => [p[1], p[2]];
        }

        // Create 2D coords for earcut
        const coords2d = [];
        for (const p of coords3d) {
          const p2 = project2d(p);
          coords2d.push(p2[0], p2[1]);
        }

        // Triangulate
        const indices = earcut(coords2d);
        if (indices.length === 0) return null;

        return indices;
      }

      // Compute sun position from lat/lng and current time.
      // Falls back to solar noon if sun is below horizon (nighttime).
      function getSunPosition(lat, lng) {
        try {
          const now = new Date();
          const startOfYear = new Date(now.getFullYear(), 0, 0);
          const dayOfYear = Math.floor((now.getTime() - startOfYear.getTime()) / 86400000);

          // Solar declination (Spencer, 1971)
          const B = ((2 * Math.PI) / 365) * (dayOfYear - 81);
          const declination = Math.asin(0.39779 * Math.sin(B));

          // Equation of time (minutes)
          const EoT = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

          // Current time as UTC hours
          const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;

          // Solar time = UTC hours + lng/15 (geographic timezone) + EoT correction
          const solarTime = utcHours + lng / 15 + EoT / 60;

          // Hour angle: 0 at solar noon, positive in afternoon
          const haRad = ((solarTime - 12) * 15 * Math.PI) / 180;

          const latRad = (lat * Math.PI) / 180;
          const sinElev =
            Math.sin(latRad) * Math.sin(declination) +
            Math.cos(latRad) * Math.cos(declination) * Math.cos(haRad);
          let elevation = Math.asin(Math.max(-1, Math.min(1, sinElev)));
          let azHa = haRad;

          // If sun is below horizon, use solar noon instead
          if (elevation <= 0) {
            const sinElevNoon =
              Math.sin(latRad) * Math.sin(declination) +
              Math.cos(latRad) * Math.cos(declination); // cos(0) = 1 at noon
            elevation = Math.asin(Math.max(-1, Math.min(1, sinElevNoon)));
            azHa = 0; // noon = due south
          }

          // Azimuth (from south, clockwise positive)
          const cosAz =
            (Math.sin(declination) - Math.sin(elevation) * Math.sin(latRad)) /
            (Math.cos(elevation) * Math.cos(latRad));
          let azimuth = Math.acos(Math.max(-1, Math.min(1, cosAz)));
          if (azHa > 0) azimuth = 2 * Math.PI - azimuth;

          // Convert to Three.js scene coords (X=east, Y=up, Z=south)
          // Azimuth is measured from south (0°), clockwise.
          // The model matrix negates Y scale which mirrors the north-south
          // axis visually, so we negate Z to compensate.
          const dist = 300;
          const x = dist * Math.cos(elevation) * Math.sin(azimuth);
          const y = dist * Math.sin(elevation);
          const z = -dist * Math.cos(elevation) * Math.cos(azimuth);

          console.log("[sun] elevation:", (elevation * 180 / Math.PI).toFixed(1) + "°",
            "azimuth:", (azimuth * 180 / Math.PI).toFixed(1) + "°",
            "nighttime:", azHa === 0,
            "pos:", x.toFixed(0), y.toFixed(0), z.toFixed(0));
          return { x, y, z };
        } catch (e) {
          console.warn("[sun] calculation failed, using default:", e);
          return { x: 100, y: 200, z: 150 };
        }
      }

        const container3d = document.getElementById("three-container");
        container3d.addEventListener("mousedown", (e) => {
          // Shift + left click to rotate

            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            e.preventDefault();
          }
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDragging || !map3d) return;
          const deltaX = e.clientX - lastX;
          const deltaY = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          const currentBearing = map3d.getBearing();
          const currentPitch = map3d.getPitch();
          map3d.setBearing(currentBearing + deltaX * rotationSensitivity);
          map3d.setPitch(Math.max(0, Math.min(90, currentPitch - deltaY * rotationSensitivity)));
        });

        window.addEventListener("mouseup", () => {
          isDragging = false;

        map3d.on("error", (e) => {

            // Target ~10 cells per dimension (100 cells total max)

            const clampedSize = Math.max(100, Math.min(5000, gridSize));

          // Calculate bounds of all features (in degrees)
          calculateBounds: function (polygonData) {

              for (const c of coords) {
                if (c[0] < minLng) minLng = c[0];
                if (c[0] > maxLng) maxLng = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];

            // Convert to meters for grid calculation
            const metersPerDegreeLng = 111320 * Math.cos((centerLat * Math.PI) / 180);
            const metersPerDegreeLat = 111320;
            return {
              minX: (minLng - centerLng) * metersPerDegreeLng,
              maxX: (maxLng - centerLng) * metersPerDegreeLng,
              minY: (minLat - centerLat) * metersPerDegreeLat,
              maxY: (maxLat - centerLat) * metersPerDegreeLat,

          getFeatureCentroid: function (coords) {

            let sumX = 0,
              sumY = 0;
            for (const c of coords) {
              sumX += (c[0] - centerLng) * metersPerDegreeLng;
              sumY += (c[1] - centerLat) * metersPerDegreeLat;
            }
            return { x: sumX / coords.length, y: sumY / coords.length };

          // Async rebuild with progress updates (used during initial load)

                    indices: [],
                    strokePositions: [],
                    strokeIndices: [],
                    color: color,

                    strokeBaseVertex: 0,
                    featureProperties: [],
                    triangleFeatureIndices: [], // Track which feature each triangle belongs to
                    minX: Infinity,
                    minY: Infinity,

          // Add a single feature's geometry to a spatial batch
          addFeatureToBatch: function (batch, coords, properties, originalFeature) {
            // Convert to local meters relative to center
            // Use per-building minAlt so all surfaces of the same gmlid share ground reference
            const gmlid = properties?.gmlid;
            const baseAlt = gmlid ? (buildingMinAlt.get(gmlid) ?? minAlt) : minAlt;
            const localCoords = coords.map((c) => {
              const lng = c[0],
                lat = c[1],
                alt = (c[2] || 0) - baseAlt + 0.01; // Per-building ground reference + small offset to avoid clipping
              const metersPerDegreeLng = 111320 * Math.cos((centerLat * Math.PI) / 180);
              const metersPerDegreeLat = 111320;
              return [(lng - centerLng) * metersPerDegreeLng, (lat - centerLat) * metersPerDegreeLat, alt];
            });

            const indices = triangulatePolygon(localCoords);
            if (!indices) return;

            // Get the feature index within this batch (will be used for triangle lookup)
            const featureIndexInBatch = batch.featureProperties.length;

            // Add fill geometry to batch and track bounds
            const baseVertex = batch.baseVertex;
            for (const p of localCoords) {
              // coords3d: [east_meters, north_meters, up_meters]
              // Three.js: X=east, Y=up, Z=-north
              const x = p[0],
                y = p[2],
                z = -p[1];
              batch.positions.push(x, y, z);

              // Track bounds for frustum culling
              if (x < batch.minX) batch.minX = x;
              if (x > batch.maxX) batch.maxX = x;
              if (y < batch.minY) batch.minY = y;
              if (y > batch.maxY) batch.maxY = y;
              if (z < batch.minZ) batch.minZ = z;
              if (z > batch.maxZ) batch.maxZ = z;
            }
            for (const idx of indices) {
              batch.indices.push(idx + baseVertex);
            }
            batch.baseVertex += localCoords.length;

            // Track which feature each triangle belongs to (indices.length/3 triangles)
            const numTriangles = indices.length / 3;
            for (let t = 0; t < numTriangles; t++) {
              batch.triangleFeatureIndices.push(featureIndexInBatch);
            }

            // Add stroke geometry (line segments for LineSegments)
            const strokeBase = batch.strokeBaseVertex;
            for (const p of localCoords) {
              batch.strokePositions.push(p[0], p[2], -p[1]);
            }
            // Create line segments (pairs of indices for closed loop)
            for (let i = 0; i < localCoords.length; i++) {
              batch.strokeIndices.push(strokeBase + i, strokeBase + ((i + 1) % localCoords.length));
            }
            batch.strokeBaseVertex += localCoords.length;

            // Store properties and original feature reference for this feature
            batch.featureProperties.push({ properties, originalFeature });
          },

          // Create batched mesh from accumulated geometry
          createBatchedMesh: function (batch) {
            const color = batch.color;
            const threeColor = new THREE.Color(color[0] / 255, color[1] / 255, color[2] / 255);
            const strokeColor = new THREE.Color(Math.max(0, color[0] / 255 - 0.08), Math.max(0, color[1] / 255 - 0.08), Math.max(0, color[2] / 255 - 0.08));

            const meshes = [];

            // Create fill mesh
            const fillGeometry = new THREE.BufferGeometry();
            fillGeometry.setAttribute("position", new THREE.Float32BufferAttribute(batch.positions, 3));
            fillGeometry.setIndex(batch.indices);
            fillGeometry.computeVertexNormals();

            // Set explicit bounding box for frustum culling
            fillGeometry.boundingBox = new THREE.Box3(
              new THREE.Vector3(batch.minX, batch.minY, batch.minZ),
              new THREE.Vector3(batch.maxX, batch.maxY, batch.maxZ),
            );
            // Compute bounding sphere from bounding box
            fillGeometry.boundingSphere = new THREE.Sphere();
            fillGeometry.boundingBox.getBoundingSphere(fillGeometry.boundingSphere);

            const targetOpacity = 1.0;
            const initialOpacity = isInitialLoad ? 0 : targetOpacity;

            const fillMaterial = new THREE.MeshLambertMaterial({
              color: threeColor,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: initialOpacity,
              depthWrite: true,
            });
            fillMaterial.userData = { targetOpacity, isFill: true, batchColor: color };

            const fillMesh = new THREE.Mesh(fillGeometry, fillMaterial);
            fillMesh.castShadow = true;
            fillMesh.receiveShadow = true;
            // Enable frustum culling (on by default, but be explicit)
            fillMesh.frustumCulled = true;
            fillMesh.userData = {
              isBatched: true,
              featureProperties: batch.featureProperties,
              triangleFeatureIndices: batch.triangleFeatureIndices,
            };
            meshes.push(fillMesh);

            // Create stroke using LineSegments for efficiency
            if (batch.strokePositions.length > 0) {
              const strokeGeometry = new THREE.BufferGeometry();
              strokeGeometry.setAttribute("position", new THREE.Float32BufferAttribute(batch.strokePositions, 3));
              strokeGeometry.setIndex(batch.strokeIndices);

              // Set explicit bounding box for frustum culling (same as fill)
              strokeGeometry.boundingBox = new THREE.Box3(
                new THREE.Vector3(batch.minX, batch.minY, batch.minZ),
                new THREE.Vector3(batch.maxX, batch.maxY, batch.maxZ),
              );
              strokeGeometry.boundingSphere = new THREE.Sphere();
              strokeGeometry.boundingBox.getBoundingSphere(strokeGeometry.boundingSphere);

              const strokeMaterial = new THREE.LineBasicMaterial({
                color: strokeColor,
                transparent: true,
                opacity: isInitialLoad ? 0 : 1.0,
              });
              strokeMaterial.userData = { targetOpacity: 1.0, isStroke: true, batchColor: color };

              const lineSegments = new THREE.LineSegments(strokeGeometry, strokeMaterial);
              lineSegments.frustumCulled = true;
              lineSegments.userData = { isBatched: true };
              meshes.push(lineSegments);
            }

            return meshes;
          },

          updateOpacity: function () {
            // Surfaces always fully opaque
            for (const mesh of this.meshes) {
              if (mesh.material && mesh.material.userData) {
                if (mesh.material.userData.isFill) {
                  mesh.material.userData.targetOpacity = 1.0;
                  mesh.material.opacity = 1.0;
                  mesh.material.depthWrite = true;
                }
              }
            }
            if (this.groundMaterial) {
              this.groundMaterial.opacity = 0.6;
            }
            targetMap.triggerRepaint();
          },

          render: function (gl, args) {
            // Skip rendering if 3D view is hidden
            if (currentView === "2d") return;

            // Animate mesh fade-in (only on initial load)
            if (meshFadeProgress < 1) {
              meshFadeProgress = Math.min(1, meshFadeProgress + 0.05);
              for (const mesh of this.meshes) {
                if (mesh.material && mesh.material.userData && mesh.material.userData.targetOpacity !== undefined) {
                  mesh.material.opacity = mesh.material.userData.targetOpacity * meshFadeProgress;
                }
              }
              if (meshFadeProgress >= 1) {
                isInitialLoad = false;
              }
              targetMap.triggerRepaint();
            }

            // Transform Three.js scene (meters, Y-up) to MapLibre clip space
            // v5 API: matrix is in args.defaultProjectionData.mainMatrix
            const m = new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);

            // Build model matrix: position at origin, scale from meters to Mercator
            const l = new THREE.Matrix4()
              .makeTranslation(modelOrigin.x, modelOrigin.y, modelOrigin.z)
              .scale(new THREE.Vector3(modelScale, -modelScale, modelScale));

            // Rotation to convert Y-up (Three.js) to Z-up (Mercator)
            const rotationX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);

            this.camera.projectionMatrix = m.multiply(l).multiply(rotationX);

            this.renderer.resetState();
            this.renderer.render(this.scene, this.camera);
          },
        };

        targetMap.addLayer(customLayer);

        // Handle resize: update Three.js renderer when map canvas resizes
        targetMap.on("resize", () => {
          if (customLayer && customLayer.renderer) {
            const canvas = targetMap.getCanvas();
            customLayer.renderer.setSize(canvas.width, canvas.height, false);
            targetMap.triggerRepaint();
          }
        });

        // Update view3d reference for category updates
        view3d = {
          map: map3d,
          setProps: () => {
            if (customLayer && customLayer.rebuildMeshes) {
              customLayer.rebuildMeshes();
              map3d.triggerRepaint();
            }
          },
        };

        // Force render when map is fully loaded
        targetMap.once("idle", () => {
          targetMap.triggerRepaint();
        });

        // 3D hover using raycaster (batched mesh aware)
        const raycaster = new THREE.Raycaster();
        const container = document.getElementById("three-container");
        const container3dCanvas = container.querySelector("canvas");

        // Helper: set up raycaster for a given NDC coordinate, using the MapLibre camera
        function setupRaycasterForNDC(ndcX, ndcY) {
          if (!customLayer || !customLayer.camera) return false;

          _cachedNearNDC.set(ndcX, ndcY, -1, 1);
          _cachedFarNDC.set(ndcX, ndcY, 1, 1);

          _cachedProjMatrixInverse.copy(customLayer.camera.projectionMatrix).invert();

          _cachedNearWorld.copy(_cachedNearNDC).applyMatrix4(_cachedProjMatrixInverse);
          _cachedNearWorld.divideScalar(_cachedNearWorld.w);

          _cachedFarWorld.copy(_cachedFarNDC).applyMatrix4(_cachedProjMatrixInverse);
          _cachedFarWorld.divideScalar(_cachedFarWorld.w);

          _cachedRayOrigin.set(_cachedNearWorld.x, _cachedNearWorld.y, _cachedNearWorld.z);
          _cachedRayDirection
            .set(_cachedFarWorld.x - _cachedNearWorld.x, _cachedFarWorld.y - _cachedNearWorld.y, _cachedFarWorld.z - _cachedNearWorld.z)
            .normalize();

          raycaster.set(_cachedRayOrigin, _cachedRayDirection);
          return true;
        }

        // Helper: get fill meshes to test for raycasting
        function getFillMeshesToTest() {
          if (!customLayer || customLayer.meshes.length === 0) return [];
          const meshesToTest = [];
          for (const mesh of customLayer.meshes) {
            if (mesh.isMesh && mesh.material?.userData?.isFill) {
              if (selectedCategory && mesh.material.userData.batchColor) {
                const batchColor = mesh.material.userData.batchColor;
                for (const [catValue, catColor] of Object.entries(categoryColorMap)) {
                  if (catColor[0] === batchColor[0] && catColor[1] === batchColor[1] && catColor[2] === batchColor[2]) {
                    if (hiddenCategories.has(catValue)) continue;
                  }
                }
              }
              meshesToTest.push(mesh);
            }
          }
          return meshesToTest;
        }

        // Mousemove handler for MapLibre 3D hover
        handle3DMouseMove = function (e, targetEl) {
          _last3DMouseEvent = e;
          _last3DMouseTarget = targetEl;
          if (!customLayer || customLayer.meshes.length === 0) return;
          if (!customLayer.camera) return;

          const rect = targetEl.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          const ndcX = (mouseX / rect.width) * 2 - 1;
          const ndcY = -(mouseY / rect.height) * 2 + 1;

          if (!setupRaycasterForNDC(ndcX, ndcY)) return;

          const meshesToTest = getFillMeshesToTest();
          const intersects = raycaster.intersectObjects(meshesToTest);
          if (intersects.length > 0) {
            const hitMesh = intersects[0].object;
            const faceIndex = intersects[0].faceIndex;

            if (hitMesh.userData?.isBatched && hitMesh.userData?.triangleFeatureIndices && faceIndex !== undefined) {
              const featureIndexInBatch = hitMesh.userData.triangleFeatureIndices[faceIndex];
              const featureData = hitMesh.userData.featureProperties[featureIndexInBatch];

              if (featureData && featureData.properties) {
                showHoverTooltip(e.clientX, e.clientY, featureData.properties);
                targetEl.style.cursor = selectedCategory ? "crosshair" : "";
                return;
              }
            }
          }
          hideHoverTooltip();
          targetEl.style.cursor = "";
        };

        container.addEventListener("mousemove", (e) => {
          handle3DMouseMove(e, container3dCanvas || container);
        });

        container.addEventListener("mouseleave", () => {
          _last3DMouseEvent = null;
          _last3DMouseTarget = null;
          hideHoverTooltip();
          if (container3dCanvas) container3dCanvas.style.cursor = "";
        });

      }

      // Initialize 2D MapLibre view with native GeoJSON rendering
      function init2DView() {
        map2d = new maplibregl.Map({
          container: "map-2d",
          style: structuredClone(MAPTILER_STYLE),
          center: [centerLng, centerLat],
          zoom: zoom,
          maxPitch: 0,
          pitchWithRotate: false,
          attributionControl: false,
          boxZoom: false, // Disable shift+drag zoom
        });

        map2d.on("error", (e) => {
          console.error("[map2d error]", e.error?.message || e);
          const status = document.getElementById("progress-status");
          if (status) status.textContent = "2D Error: " + (e.error?.message || "unknown");
        });

        map2d.on("load", () => {
          // Track vector layer IDs for toggling
          if (vectorStyleLayers.length === 0) {
            vectorStyleLayers = map2d.getStyle().layers.map(l => l.id);
          }
          // Add satellite source and layer
          map2d.addSource("satellite-tiles", {
            type: "raster",
            tiles: ["https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=xlQ4I66qbGWwrztUO21v"],
            tileSize: 512,
          });
          map2d.addLayer({
            id: "satellite-layer",
            type: "raster",
            source: "satellite-tiles",
            paint: { "raster-opacity": 0 },
          }, vectorStyleLayers[0]);

          map2d.addSource("geojson-data", {
            type: "geojson",
            data: geojsonData,
          });

          // Add fill layer
          map2d.addLayer({
            id: "geojson-fill",
            type: "fill",
            source: "geojson-data",
            paint: {
              "fill-color": "#4a9eff",
              "fill-opacity": 0.1,
            },
          });

          // Add outline layer
          map2d.addLayer({
            id: "geojson-outline",
            type: "line",
            source: "geojson-data",
            paint: {
              "line-color": "#4a9eff",
              "line-width": 2,
            },
          });

          // Update label positions on map move
          map2d.on("move", () => {
            updateHoverTooltipPosition();
          });

          update2DColors();

          // Hover tooltip for 2D view
          map2d.on("mousemove", "geojson-fill", (e) => {
            if (e.features && e.features.length > 0) {
              const feature = e.features[0];
              const rect = map2d.getCanvas().getBoundingClientRect();
              showHoverTooltip(rect.left + e.point.x, rect.top + e.point.y, feature.properties, e.lngLat);
              map2d.getCanvas().style.cursor = selectedCategory ? "crosshair" : "";
            }
          });

          map2d.on("mouseleave", "geojson-fill", () => {
            hideHoverTooltip();
            map2d.getCanvas().style.cursor = "";
          });

        });
      }

      function update2DColors() {
        if (!map2d || !map2d.getLayer("geojson-fill")) return;

        if (!selectedCategory) {
          const uniformHex = rgbToHex(uniformColor[0], uniformColor[1], uniformColor[2]);
          map2d.setPaintProperty("geojson-fill", "fill-color", uniformHex);
          map2d.setPaintProperty("geojson-outline", "line-color", uniformHex);
        } else {
          // Build match expression for colors
          // Convert value to string, handling null specially (to-string returns "" for null)
          const entries = Object.entries(categoryColorMap);
          if (entries.length === 0) {
            map2d.setPaintProperty("geojson-fill", "fill-color", "#808080");
            map2d.setPaintProperty("geojson-outline", "line-color", "#808080");
          } else {
            const valueExpr = ["case", ["==", ["get", selectedCategory], null], "null", ["to-string", ["get", selectedCategory]]];
            const matchExpr = ["match", valueExpr];
            entries.forEach(([value, color]) => {
              matchExpr.push(value);
              matchExpr.push(rgbToHex(color[0], color[1], color[2]));
            });
            matchExpr.push("#808080"); // default color

            map2d.setPaintProperty("geojson-fill", "fill-color", matchExpr);
            map2d.setPaintProperty("geojson-outline", "line-color", matchExpr);
          }
        }

        // Add filter for hidden categories
        if (selectedCategory && hiddenCategories.size > 0) {
          const hiddenValues = Array.from(hiddenCategories);
          // Convert value to string, handling null specially
          const valueExpr = ["case", ["==", ["get", selectedCategory], null], "null", ["to-string", ["get", selectedCategory]]];
          const filterExpr = ["!", ["in", valueExpr, ["literal", hiddenValues]]];
          map2d.setFilter("geojson-fill", filterExpr);
          map2d.setFilter("geojson-outline", filterExpr);
        } else {
          map2d.setFilter("geojson-fill", null);
          map2d.setFilter("geojson-outline", null);
        }
      }

      // handle3DMouseMove is defined inside addThreeLayer; expose a reference
      let handle3DMouseMove = null;

      function redetect3DHover() {
        if (handle3DMouseMove && _last3DMouseEvent && _last3DMouseTarget) {
          handle3DMouseMove(_last3DMouseEvent, _last3DMouseTarget);
        }
      }

      function updateLayers() {
        buildCategoryColorMap();

        if (view3d && view3d.setProps) {
          view3d.setProps();
        }

        update2DColors();
        redetect3DHover();
      }

      function updateVisibility() {
        if (view3d && view3d.setProps) {
          view3d.setProps();
        }

        update2DColors();
        redetect3DHover();
      }

      // View toggle buttons
      let viewSwitching = false;
      function setView(view) {
        currentView = view;
        hideHoverTooltip();
        viewSwitching = true;

        document.querySelectorAll(".controls button").forEach((b) => b.classList.remove("active"));
        document.getElementById("btn-" + (view === "both" ? "both" : view === "3d" ? "3d" : "2d")).classList.add("active");

        const container3d = document.getElementById("view-3d");
        const container2d = document.getElementById("view-2d");
        const divider = document.getElementById("divider");

        if (view === "both") {
          container3d.classList.remove("hidden");
          container2d.classList.remove("hidden");
          divider.classList.remove("hidden");
          // Reset to default 50/50 split
          container3d.style.flex = "";
          container3d.style.width = "";
          container2d.style.flex = "";
          container2d.style.width = "";
          // Resume rendering on both maps
          if (map3d) map3d.triggerRepaint();
          if (map2d) map2d.triggerRepaint();
        } else if (view === "3d") {
          container3d.classList.remove("hidden");
          container2d.classList.add("hidden");
          divider.classList.add("hidden");
          // Stop rendering on hidden map
          if (map2d) map2d.stop();
        } else {
          container3d.classList.add("hidden");
          container2d.classList.remove("hidden");
          divider.classList.add("hidden");
          // Stop rendering on hidden map
          if (map3d) map3d.stop();
        }

        // Trigger resize after a short delay, then re-enable syncing
        setTimeout(() => {
          if (map3d) map3d.resize();
          if (map2d) map2d.resize();
          setTimeout(() => {
            viewSwitching = false;
          }, 50);
        }, 100);
      }

      // Divider drag to resize views
      function initDividerDrag() {
        const divider = document.getElementById("divider");
        const container3d = document.getElementById("view-3d");
        const container2d = document.getElementById("view-2d");
        const mainContainer = document.querySelector(".main-container");

        let isDragging = false;
        let resizeScheduled = false;

        divider.addEventListener("mousedown", (e) => {
          if (currentView !== "both") return;
          isDragging = true;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
          if (!isDragging) return;

          const containerRect = mainContainer.getBoundingClientRect();
          const containerWidth = containerRect.width;
          let percentage = ((e.clientX - containerRect.left) / containerWidth) * 100;

          // Snap to middle (50%) when within 3% of center
          if (Math.abs(percentage - 50) < 3) {
            percentage = 50;
          }

          // Clamp between 20% and 80%
          percentage = Math.max(20, Math.min(80, percentage));

          // Use calc to account for divider width
          container3d.style.flex = "none";
          container3d.style.width = `calc(${percentage}% - 0.5px)`;
          container2d.style.flex = "none";
          container2d.style.width = `calc(${100 - percentage}% - 0.5px)`;

          // Throttle map resize to once per frame
          if (!resizeScheduled) {
            resizeScheduled = true;
            requestAnimationFrame(() => {
              if (map3d) map3d.resize();
              if (map2d) map2d.resize();
              resizeScheduled = false;
            });
          }
        });

        document.addEventListener("mouseup", () => {
          if (isDragging) {
            isDragging = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            // Final resize to ensure maps are correctly sized
            if (map3d) map3d.resize();
            if (map2d) map2d.resize();
          }
        });
      }

      // Initialize when DOM is ready (or immediately if already loaded)
      async function initApp() {
        // Combobox setup
        const comboboxTrigger = document.getElementById("combobox-trigger");
        const comboboxPopover = document.getElementById("combobox-popover");
        const comboboxInput = document.getElementById("combobox-input");
        const comboboxList = document.getElementById("combobox-list");
        const categoryOptions = ["", ...allColumns]; // Empty string = "None"
        let comboboxOpen = false;

        function getOptionLabel(value) {
          return value === "" ? "None (uniform color)" : value;
        }

        function updateComboboxTrigger() {
          const span = comboboxTrigger.querySelector("span");
          if (selectedCategory) {
            span.textContent = selectedCategory;
            span.classList.remove("placeholder");
          } else {
            span.textContent = "Select category...";
            span.classList.add("placeholder");
          }
        }

        function renderComboboxItems(filter = "") {
          const filterLower = filter.toLowerCase();
          const filtered = categoryOptions.filter((opt) => getOptionLabel(opt).toLowerCase().includes(filterLower));

          if (filtered.length === 0) {
            comboboxList.innerHTML = '<div class="combobox-empty">No category found.</div>';
            return;
          }

          comboboxList.innerHTML = filtered
            .map((opt) => {
              const label = getOptionLabel(opt);
              const isSelected = (opt === "" && !selectedCategory) || opt === selectedCategory;
              const checkClass = isSelected ? "" : "check-hidden";
              return `
                        <div class="combobox-item${isSelected ? " selected" : ""}" data-value="${opt}" role="option">
                            <svg class="${checkClass}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>${label}</span>
                        </div>
                    `;
            })
            .join("");

          // Add click handlers
          comboboxList.querySelectorAll(".combobox-item").forEach((item) => {
            item.addEventListener("click", () => {
              const value = item.dataset.value;
              selectedCategory = value || null;
              updateComboboxTrigger();
              closeCombobox();
              updateLayers();
            });
          });
        }

        function openCombobox() {
          comboboxOpen = true;
          comboboxPopover.classList.remove("hidden");
          comboboxTrigger.setAttribute("aria-expanded", "true");
          comboboxInput.value = "";
          renderComboboxItems();
          comboboxInput.focus();
        }

        function closeCombobox() {
          comboboxOpen = false;
          comboboxPopover.classList.add("hidden");
          comboboxTrigger.setAttribute("aria-expanded", "false");
          comboboxTrigger.focus();
        }

        comboboxTrigger.addEventListener("click", () => {
          if (comboboxOpen) {
            closeCombobox();
          } else {
            openCombobox();
          }
        });

        comboboxInput.addEventListener("input", (e) => {
          renderComboboxItems(e.target.value);
        });

        comboboxInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeCombobox();
          } else if (e.key === "Enter") {
            const firstItem = comboboxList.querySelector(".combobox-item");
            if (firstItem) firstItem.click();
          }
        });

        // Close on outside click
        document.addEventListener("click", (e) => {
          if (comboboxOpen && !e.target.closest("#category-combobox")) {
            closeCombobox();
          }
        });

        // Initialize trigger text
        updateComboboxTrigger();

        // Color picker event handler
        const colorPickerInput = document.getElementById("color-picker-input");
        colorPickerInput.addEventListener("input", (e) => {
          if (activeColorCategory !== null) {
            const newColor = hexToRgb(e.target.value);
            if (activeColorCategory === "__uniform__") {
              updateUniformColor(newColor);
            } else {
              updateCategoryColor(activeColorCategory, newColor);
            }
          }
        });

        document.getElementById("btn-both").addEventListener("click", () => setView("both"));
        document.getElementById("btn-3d").addEventListener("click", () => setView("3d"));
        document.getElementById("btn-2d").addEventListener("click", () => setView("2d"));
        document.getElementById("btn-link").addEventListener("click", toggleCameraLink);

        // Keyboard shortcuts - O(1) lookup instead of if-chain
        const keyHandlers = {
          v: () => {
            // Cycle view modes: both -> 3d -> 2d -> both
            const views = ["both", "3d", "2d"];
            const idx = views.indexOf(currentView);
            setView(views[(idx + 1) % views.length]);
          },
          c: () => {
            // Cycle categories: null -> col1 -> col2 -> ... -> null
            const currentIdx = categoryOptions.indexOf(selectedCategory || "");
            const nextIdx = (currentIdx + 1) % categoryOptions.length;
            selectedCategory = categoryOptions[nextIdx] || null;
            updateComboboxTrigger();
            updateLayers();
          },
          m: () => {
            // Cycle through map styles: map -> none -> map
            const styles = ["map", "none"];
            const idx = styles.indexOf(mapStyle);
            setMapStyle(styles[(idx + 1) % styles.length]);
          },
          n: () => {
            if (map3d) map3d.easeTo({ bearing: 0, duration: 300 });
            if (map2d) map2d.easeTo({ bearing: 0, duration: 300 });
          },
          l: () => toggleCameraLink(),
          " ": () => toggleCameraLink(),
          a: () => {
            const currentBearing = map3d ? map3d.getBearing() : 0;
            if (map3d) map3d.easeTo({ bearing: currentBearing - 15, duration: 150 });
            if (map2d && cameraLinked) map2d.easeTo({ bearing: currentBearing - 15, duration: 150 });
          },
          d: () => {
            const currentBearing = map3d ? map3d.getBearing() : 0;
            if (map3d) map3d.easeTo({ bearing: currentBearing + 15, duration: 150 });
            if (map2d && cameraLinked) map2d.easeTo({ bearing: currentBearing + 15, duration: 150 });
          },
          w: () => {
            const currentPitch = map3d ? map3d.getPitch() : 0;
            if (map3d) map3d.easeTo({ pitch: Math.min(90, currentPitch + 10), duration: 150 });
          },
          s: () => {
            const currentPitch = map3d ? map3d.getPitch() : 0;
            if (map3d) map3d.easeTo({ pitch: Math.max(0, currentPitch - 10), duration: 150 });
          },
          r: () => {
            const currentZoom = map3d ? map3d.getZoom() : map2d.getZoom();
            if (map3d) map3d.easeTo({ zoom: currentZoom + 0.5, duration: 150 });
            if (map2d) map2d.easeTo({ zoom: currentZoom + 0.5, duration: 150 });
          },
          f: () => {
            const currentZoom = map3d ? map3d.getZoom() : map2d.getZoom();
            if (map3d) map3d.easeTo({ zoom: currentZoom - 0.5, duration: 150 });
            if (map2d) map2d.easeTo({ zoom: currentZoom - 0.5, duration: 150 });
          },
          x: () => {
            if (!selectedCategory || Object.keys(categoryColorMap).length <= 1) return;
            const categories = Object.keys(categoryColorMap);
            const visibleCategories = categories.filter((c) => !hiddenCategories.has(c));
            let nextSoloIndex = visibleCategories.length === 1 ? (categories.indexOf(visibleCategories[0]) + 1) % categories.length : 0;
            hiddenCategories.clear();
            categories.forEach((cat, idx) => {
              if (idx !== nextSoloIndex) hiddenCategories.add(cat);
            });
            document.querySelectorAll(".legend-item").forEach((item, idx) => {
              item.classList.toggle("hidden-category", hiddenCategories.has(categories[idx]));
            });
            updateSoloNextIndicator();
            updateVisibility();
          },
          z: () => {
            if (!selectedCategory || Object.keys(categoryColorMap).length <= 1) return;
            hiddenCategories.clear();
            document.querySelectorAll(".legend-item").forEach((item) => item.classList.remove("hidden-category"));
            updateSoloNextIndicator();
            updateVisibility();
          },
        };

        // Number key handlers for legend items (1-9, 0)
        const numKeyHandler = (key) => {
          const legendIndex = key === "0" ? 9 : parseInt(key) - 1;
          const legendItem = document.querySelector(`.legend-item[data-legend-index="${legendIndex}"]`);
          if (legendItem) legendItem.click();
        };

        document.addEventListener("keydown", (e) => {
          // Skip if typing in input fields
          if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

          // Skip modifier key combos
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const key = e.key.toLowerCase();
          if (keyHandlers[key]) {
            keyHandlers[key]();
          } else if (e.key >= "0" && e.key <= "9") {
            numKeyHandler(e.key);
          }
        });

        // Initialize views with progress tracking
        progress.update(30, "Initializing views...");

        // Initialize both views
        init2DView();
        init3DView();
        initDividerDrag();

        // Hide progress when 2D is ready
        map2d.once("idle", async () => {
          progress.update(40, "2D view ready, building 3D...");
          await new Promise((r) => setTimeout(r, 100));
          progress.hide();
        });

        // Sync views - simple center/zoom/bearing sync
        let syncing = false;
        let cameraLinked = true;

        function sync3dTo2d() {
          if (syncing || viewSwitching || currentView !== "both" || !cameraLinked) return;
          syncing = true;

          map2d.setCenter(map3d.getCenter());
          map2d.setZoom(map3d.getZoom());
          map2d.setBearing(map3d.getBearing());

          syncing = false;
        }

        function sync2dTo3d() {
          if (syncing || viewSwitching || currentView !== "both" || !cameraLinked) return;
          syncing = true;

          map3d.setCenter(map2d.getCenter());
          map3d.setZoom(map2d.getZoom());
          map3d.setBearing(map2d.getBearing());

          syncing = false;
        }

        function toggleCameraLink() {
          cameraLinked = !cameraLinked;
          const btnLink = document.getElementById("btn-link");
          btnLink.classList.toggle("active", cameraLinked);
        }

        // Wait for both maps to load before setting up sync
        let mapsLoaded = 0;
        function onMapLoad() {
          mapsLoaded++;
          if (mapsLoaded === 2) {
            map3d.on("move", sync3dTo2d);
            map2d.on("move", sync2dTo3d);
          }
        }

        map3d.on("load", onMapLoad);
        map2d.on("load", onMapLoad);

        // Style toggle functionality
        const btnMap = document.getElementById("btn-map");
        const btnSatellite = document.getElementById("btn-satellite");
        const btnNone = document.getElementById("btn-none");

        function setMapStyle(style) {
          if (mapStyle === style) return;

          const wasNone = mapStyle === "none";
          mapStyle = style;

          // Update button states
          btnMap.classList.toggle("active", mapStyle === "map");
          btnSatellite.classList.toggle("active", mapStyle === "satellite");
          btnNone.classList.toggle("active", mapStyle === "none");

          // Toggle layer visibility on both maps
          const showVector = mapStyle === "map";
          const satOpacity = mapStyle === "satellite" ? 1 : 0;

          // Toggle vector style layers visibility
          for (const map of [map3d, map2d]) {
            for (const layerId of vectorStyleLayers) {
              if (map.getLayer(layerId)) {
                map.setLayoutProperty(layerId, "visibility", showVector ? "visible" : "none");
              }
            }
            if (map.getLayer("satellite-layer")) {
              map.setPaintProperty("satellite-layer", "raster-opacity", satOpacity);
            }
          }

          // Update Three.js mesh opacity
          if (customLayer && customLayer.updateOpacity) {
            customLayer.updateOpacity();
          }
        }

        btnMap.addEventListener("click", () => setMapStyle("map"));
        btnSatellite.addEventListener("click", () => setMapStyle("satellite"));
        btnNone.addEventListener("click", () => setMapStyle("none"));

        // Compass functionality
        const compass = document.getElementById("compass");
        const compassSvg = compass.querySelector("svg");
        let currentCompassRotation = -45; // Icon points 45° to top-right

        function updateCompass() {
          // Icon points 45° to top-right, subtract 45 to make it point up at bearing=0
          const bearing = map3d ? map3d.getBearing() : 0;
          let targetRotation = -bearing - 45;

          // Find the shortest rotation path
          let delta = targetRotation - currentCompassRotation;
          // Normalize delta to [-180, 180]
          while (delta > 180) delta -= 360;
          while (delta < -180) delta += 360;

          currentCompassRotation += delta;
          compassSvg.style.transform = `rotate(${currentCompassRotation}deg)`;
        }

        // Update compass on map move
        function setupCompassSync() {
          if (map3d) {
            map3d.on("rotate", updateCompass);
            updateCompass();
          }
        }

        map3d.on("load", setupCompassSync);

        // Click to reset bearing to north
        compass.addEventListener("click", () => {
          if (map3d) {
            map3d.easeTo({ bearing: 0, duration: 300 });
          }
          if (map2d) {
            map2d.easeTo({ bearing: 0, duration: 300 });
          }
        });
      }

      // Run initApp - DOM is already ready since ES modules are deferred
      function safeInitApp() {
        initApp().catch((e) => {
          console.error("initApp failed:", e);
          const status = document.getElementById("progress-status");
          if (status) status.textContent = "Error: " + e.message;
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", safeInitApp);
      } else {
        safeInitApp();
      }
    </script>
  </body>
</html>
